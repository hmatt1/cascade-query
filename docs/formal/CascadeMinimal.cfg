\* Minimal re-execution (G2): one caller at the newest revision, no
\* evictions. Longer histories and three values, so that a write can change
\* choose without changing top. Checks everything CascadeCore.cfg does, and
\* that top runs again only after choose has had another value.

SPECIFICATION Spec

CONSTANTS
    MaxRev = 5
    ValueSet = {0, 1, 2}
    Readers = {r1}
    SnapshotReads = FALSE
    Evictions = FALSE
    None = None

INVARIANT TypeOK
INVARIANT ReadsMatchFreshRun
INVARIANT RowsAreSound
INVARIANT RecordedDependenciesHold
INVARIANT StampsNameValues
INVARIANT CleanRowsRestOnCleanRows
INVARIANT OneRunPerRevision
INVARIANT MarkersBoundedByRevision
INVARIANT TopRunsOnlyAfterChooseMoved

PROPERTY Monotone
