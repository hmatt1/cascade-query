\* Safety under concurrency: two callers at any revisions, writers and
\* evictions, in every interleaving, for up to MaxRev writes. Exhaustive:
\* 26 million states, four and a half minutes with four workers.

SPECIFICATION Spec

CONSTANTS
    MaxRev = 2
    ValueSet = {0, 1}
    Readers = {r1, r2}
    SnapshotReads = TRUE
    Evictions = TRUE
    None = None

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT ReadsMatchFreshRun
INVARIANT RowsAreSound
INVARIANT RecordedDependenciesHold
INVARIANT StampsNameValues
INVARIANT CleanRowsRestOnCleanRows
INVARIANT OneRunPerRevision
INVARIANT MarkersBoundedByRevision

PROPERTY Monotone
