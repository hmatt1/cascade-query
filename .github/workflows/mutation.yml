name: Mutation testing

# mutmut changes the source one small step at a time (a `<` to `<=`, a `+ 1`
# dropped) and runs the tests that reach the changed function. A mutant that
# no test notices "survives". The survival rate, per module, shows where the
# tests execute code without asserting what it does.
#
# A full run is hours of test runs, so it only runs when started by hand,
# split by module (scripts/mutation.py lists the shards). A machine with many
# cores does it faster: see "Mutation testing" in the README. It reports; it
# does not gate.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Shards to run, separated by spaces (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: List shards
        id: shards
        env:
          ONLY: ${{ inputs.shards }}
        run: |
          # Fails if a module of src/cascade is in no shard.
          matrix="$(python scripts/mutation.py shards $ONLY)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutate:
    name: Mutate ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mutmut
        # Below the job's limit, so that a shard that runs out of time still
        # gets to report the mutants it did check.
        timeout-minutes: 330
        env:
          MUTANTS: ${{ matrix.mutants }}
        run: |
          set -f  # the mutant patterns contain `*`
          python scripts/mutation.py run --max-children "$(nproc)" $MUTANTS

      - name: Collect results
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python scripts/mutation.py collect --shard "$SHARD" \
            --out "mutation-results/$SHARD" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.shard }}
          path: mutation-results/
          if-no-files-found: ignore

  report:
    name: Survival rate
    needs: mutate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          path: mutation-results
          merge-multiple: true

      - name: Summarise
        run: |
          set -o pipefail
          python scripts/mutation.py summary mutation-results \
            --json mutation-results/summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-results/
          if-no-files-found: ignore
