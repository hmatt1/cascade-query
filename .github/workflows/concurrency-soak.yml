name: Concurrency soak (Python 3.14t)

# On-demand free-threaded soak test: runs the concurrency, race, cycle,
# transaction, and collection compaction test suites repeatedly with
# PYTHON_GIL=0 on Python 3.14t to surface low-probability races.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Number of soak rounds to run"
        required: false
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  soak:
    name: Free-threaded soak (${{ inputs.rounds || '50' }} rounds)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHON_GIL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14t
        uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify free-threaded runtime
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          if sysconfig.get_config_var("Py_GIL_DISABLED") != 1:
              raise SystemExit("Interpreter is not a free-threaded build.")
          if sys._is_gil_enabled():
              raise SystemExit("GIL is enabled. Expected free-threaded execution (PYTHON_GIL=0).")
          print("Verified free-threaded runtime with GIL disabled.")
          PY

      - name: Run concurrency soak
        env:
          ROUNDS: ${{ inputs.rounds || '50' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          rounds = int(os.environ.get("ROUNDS", "50"))
          if rounds < 1:
              raise SystemExit(f"rounds must be >= 1, got {rounds}")

          files = [
              "tests/test_engine_concurrency.py",
              "tests/test_cross_thread_cycles.py",
              "tests/test_snapshot_verification_race.py",
              "tests/test_fixed_point_dropped_members.py",
              "tests/test_collection_compaction_pins.py",
              "tests/test_collection_concurrency.py",
              "tests/test_transaction_ownership.py",
              "tests/test_cancellation_joins.py",
              "tests/test_dirty_propagation.py",
          ]

          for i in range(1, rounds + 1):
              print(f"=== Soak round {i}/{rounds} ===", flush=True)
              proc = subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", "--tb=short", *files]
              )
              if proc.returncode != 0:
                  raise SystemExit(f"Soak failed on round {i}/{rounds}")
          print(f"Completed all {rounds} soak rounds with 0 failures.")
          PY
