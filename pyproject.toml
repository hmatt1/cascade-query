[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-cascade"
version = "0.3.0"
description = "Minimal demand-driven query framework for incremental computation."
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
disk = [
    "libmdbx",
    "msgpack",
]
dev = [
    "hypothesis",
    "libmdbx",
    "msgpack",
    "mutmut",
    "numpy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-m", "not slow"]
markers = [
    "slow: resource-intensive scale and stress scenarios",
]

[tool.coverage.run]
branch = true
source = ["cascade"]

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.mutmut]
# mutmut 3 option names. It runs pytest inside a copy of the project under
# mutants/, where this file's [tool.pytest.ini_options] applies as well, so
# slow tests are deselected there too. Run by .github/workflows/mutation.yml.
source_paths = ["src/cascade/"]
pytest_add_cli_args_test_selection = ["tests/"]
# The performance tests assert on timings, which the instrumented copy of the
# source does not keep. CI runs them apart from the suite for the same reason.
pytest_add_cli_args = ["--ignore=tests/test_performance.py"]
mutate_only_covered_lines = true
# tests/test_examples.py runs the scripts in examples/.
also_copy = ["benchmarks", "examples"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
